<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-Bot</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/chatbot.js"></script>

    <!-- babel translate jsx to js -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput({chatMessages, setChatMessages}) {
            const [inputText, setInputText] = React.useState('');

            function saveInputText(event){
                setInputText(event.target.value);
            }
            function sendMessage(){
                const newChatMessages = [...chatMessages, {
                    message: inputText,
                    sender: 'user',
                    id: crypto.randomUUID()
                }];
                setChatMessages(newChatMessages);
                
                setInputText('');   

                setChatMessages([...newChatMessages,{
                    message: Chatbot.getResponse(inputText),
                    sender: 'robot',
                    id: crypto.randomUUID()
                }]);

            }
            return (
                <>
                    <input onChange={saveInputText} placeholder="enter your message" width="50" value={inputText} />
                    <button onClick={sendMessage}>Send</button>
                </>
            );
        }
        function ChatMessage({ message, sender }) {
            return (
                <div>
                    {sender === 'robot' && <img src="images/robot.png" width="30" />}
                    {message}
                    {sender === 'user' && <img src="images/sender.png" width="30" />}
                </div>
            );
        }
        function ChatMessages({ chatMessages }) {
            return (
                <>
                    {chatMessages.map((chatMessage) => {
                        return (
                           <ChatMessage 
                                message={chatMessage.message} 
                                sender={chatMessage.sender} 
                                key={chatMessage.id} 
                           />
                        );
                    })}
                </>
            );
        }
        function App() {
            const [chatMessages, setChatMessages] = React.useState([
                {
                    message: 'Hello',
                    sender: 'user',
                    id: "id1"
                },
                {
                    message: 'How can I help you?',
                    sender: 'robot',
                    id: "id2"
                }
            ]);
            return (
                <>
                    <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
                    <ChatMessages chatMessages={chatMessages} />
                </>
            );
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
