<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-Bot</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Open Sans', sans-serif;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .send-button {
            padding: 12px 20px;
            margin-left: 15px;
            border: none;
            border-radius: 8px;
            font-family: inherit
        }

        .chat-input-container {
            display: flex;
            margin-bottom: 60px;
        }

        .chat-input {
            padding: 10px 15px;
            border-radius: 8px;
            flex-grow: 1;
        }

        .app-container {
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-message-sender {
            display: flex;
            justify-content: end;
            padding-bottom: 10px;
            align-items: start;
        }

        .chat-message-robot {
            display: flex;
            padding-bottom: 10px;
            align-items: start;
        }

        .chat-message-text {
            background-color: rgb(238,238,238);
            padding: 10px 15px;
            border-radius: 8px;
            margin-left: 5px;
            margin-right: 5px;
        }

        .chat-messages-container {
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/chatbot.js"></script>

    <!-- babel translate jsx to js -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');

            function saveInputText(event) {
                setInputText(event.target.value);
            }
            function sendMessage() {
                const newChatMessages = [...chatMessages, {
                    message: inputText,
                    sender: 'user',
                    id: crypto.randomUUID()
                }];
                setChatMessages(newChatMessages);

                setInputText('');

                setChatMessages([...newChatMessages, {
                    message: Chatbot.getResponse(inputText),
                    sender: 'robot',
                    id: crypto.randomUUID()
                }]);

            }
            return (
                <div className="chat-input-container">
                    <input className="chat-input" onChange={saveInputText} placeholder="enter your message" width="50" value={inputText} />
                    <button className="send-button" onClick={sendMessage}>Send</button>
                </div>
            );
        }
        function ChatMessage({ message, sender }) {
            return (
                <div className={sender==='robot'? 'chat-message-robot' : 'chat-message-sender'}>
                    {sender === 'robot' && <img src="images/robot.png" width="30" />}
                    <div className="chat-message-text">
                        {message}
                    </div>
                    {sender === 'user' && <img src="images/sender.png" width="30" />}
                </div>
            );
        }
        function ChatMessages({ chatMessages }) {
            const chatMessagesRef = React.useRef(null);
            React.useEffect(()=>{
                const containerElem = chatMessagesRef.current;
                if(containerElem){
                    containerElem.scrollTop = containerElem.scrollHeight;
                }
            }, [chatMessages]);
            return (
                <div className="chat-messages-container" ref={chatMessagesRef}>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                </div>
            );
        }
        function App() {
            const [chatMessages, setChatMessages] = React.useState([
                {
                    message: 'Hello',
                    sender: 'user',
                    id: "id1"
                },
                {
                    message: 'How can I help you?',
                    sender: 'robot',
                    id: "id2"
                }
            ]);
            return (
                <div className="app-container">
                    <ChatMessages chatMessages={chatMessages} />
                    <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
                </div>
            );
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
