<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-Bot</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- babel translate jsx to js -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput() {
            return (
                <>
                    <input placeholder="enter your message" width="50" />
                    <button>Send</button>
                </>
            );
        }
        function ChatMessage({ message, sender }) {
            return (
                <div>
                    {sender === 'robot' && <img src="images/robot.png" width="30"/>}
                    {message}
                    {sender === 'user' && <img src="images/sender.png" width="30"/>}
                </div>
            );
        }

        function App() {
            return (
                <>
                    <ChatInput />
                    <ChatMessage message="Hello"  sender="user" />
                    <ChatMessage message="Hello, how can I help you?"  sender="robot" />
                </>
            );
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
